name: resource-compass
x-api: &api
  build: ./apps/api
  user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
  volumes:
    - ./data:/data
    - ./backups:/backups
  environment: &api-env
    SQLITE_PATH: /data/resource-compass.db
services:
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  bootstrap:
    <<: *api
    command: ["bootstrap"]
    profiles: ["setup"]
    environment:
      <<: *api-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@resourcemgmt.com}
      ORG_NAME: ${ORG_NAME:-Engineering}
  api:
    <<: *api
    environment:
      <<: *api-env
      SMTP_ADDR: mail:1025
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [mail]
  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
